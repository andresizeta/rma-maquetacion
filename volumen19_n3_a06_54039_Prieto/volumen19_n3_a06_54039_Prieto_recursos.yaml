figuras:
  1:
    ancho: "columna"
    es: "Registro fotográfico de los talleres participativos. Se observan distintas instancias de las actividades, incluyendo la interacción de las infancias y los materiales dispuestos para el procesamiento (rocas de molienda, recursos vegetales y productos obtenidos), así como gestos, posturas y modalidades de manipulación de los artefactos durante la experimentación."
    en: "<em>Photographic record of the participatory workshops. Various moments of the activities are shown, including children&#x27;s interaction and the materials provided for processing (grinding stones, plant resources, and resulting products), as well as gestures, postures, and modes of handling the artifacts during experimentation.</em>"
  2:
    ancho: "completo"
    es: "Eufemia Teodora Mamani durante la preparación de alimentos en la cocina. La secuencia muestra el uso de sus piedras de moler para el procesamiento de tomates y pimientos, junto con otras tecnologías empleadas en la actividad."
    en: "<em>Eufemia Teodora Mamani during food preparation in the kitchen. The sequence shows the use of her grinding stones for processing tomatoes and peppers, along with other technologies used in the activity.</em>"
  3:
    ancho: "completo"
    es: "Registros de dos interlocutoras entrevistadas. Arriba, Rita Rosa durante una recorrida por el territorio ancestral de su comunidad, recolectando plantas destinadas a usos posteriores, y con vestimenta y platería tradicional. Abajo, Paula Cariñanco presenta parte de las plantas que conserva para su uso cotidiano y las piedras utilizadas para la molienda."
    en: "<em>Records of two interviewed participants. Above, Rita Rosa during a walk through her community&#x27;s ancestral territory, gathering plants for later use, wearing traditional clothing and silverwork. Below, Paula Cariñanco presents some of the plants she keeps for everyday use, along with the stones used for grinding.</em>"
  4:
    ancho: "completo"
    es: "César Tutushima Montufar junto a la piedra utilizada para chancar ajo, integrada a otros implementos de cocina (arriba). Abajo, mapa mental elaborado por el entrevistado durante la entrevista, en el que representa el espacio de su infancia y la centralidad de la piedra de moler en la vida familiar."
    en: "<em>César Tutushima Montufar next to the stone used for crushing garlic, alongside other kitchen implements (above). Below, a mental map drawn by the interviewee during the interview, in which he represents the space of his childhood and the centrality of the grinding stone in family life.</em>"

