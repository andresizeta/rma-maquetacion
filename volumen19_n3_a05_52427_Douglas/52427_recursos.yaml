figuras:
  1:
    ancho: "columna"
    es: "<em>Contexto espacial del Complejo Prehistórico de Ħal Tarxien. (A) Ubicación de las Islas Maltesas (cuadro rojo) en el Mediterráneo central. (B) Modelo digital de elevación de Malta que indica la ubicación del Complejo Prehistórico de Ħal Tarxien. (C) Plano del Complejo Prehistórico de Ħal Tarxien que muestra la posición del pozo.</em>"
    en: "Spatial context of the Ħal Tarxien Prehistoric Complex. (A) Location of the Maltese Islands (red square) within the central Mediterranean. (B) Digital elevation model of Malta indicating the location of the Ħal Tarxien Prehistoric Complex. (C) Plan of the Ħal Tarxien Prehistoric Complex showing the position of the pit."
  2:
    ancho: "completo"
    es: "<em>(a) Dibujo en sección del pozo, reproducido de Grima (2016: 38), a partir de Ashby (1924); (b) el pozo en el momento de su redescubrimiento en 2010; (c) la depresión tal como se observó en 2024.</em>"
    en: "(a) Section drawing of the pit, reproduced from Grima (2016: 38), after Ashby (1924); (b) the pit at the time of its rediscovery in 2010; (c) the depression as observed in 2024."
  3:
    ancho: "completo"
    alto_max: "74mm"
    es: "<em>Marco clasificatorio que ilustra los procesos de deposición interpretados identificados en el conjunto del pozo.</em>"
    en: "Classificatory framework illustrating the interpreted depositional processes identified within the pit assemblage."
  4:
    ancho: "completo"
    es: "<em>Comparación por país de los totales de visitantes registrados (T-Visitors, 2021-2024) y de monedas no euro (T-Coins, 2010-2024) en el Complejo Prehistórico de Ħal Tarxien. Se excluyen los países que utilizaban el euro en 2024. Los totales de visitantes se representan mediante barras en el eje y izquierdo y los totales de monedas mediante una línea en el eje y derecho.</em>"
    en: "Comparison by country of recorded visitor totals (T-Visitors, 2021-2024) and non-euro coin totals (T-Coins, 2010-2024) at the Ħal Tarxien Prehistoric Complex. Countries using the euro in 2024 are excluded. Visitor totals are represented by bars on the left-hand y-axis and coin totals by a line on the right-hand y-axis."
  5:
    ancho: "columna"
    es: "<em>Objetos recuperados del pozo del Complejo Prehistórico de Ħal Tarxien, excluidas las monedas. La fotografía se tomó inmediatamente después de la extracción del material del pozo.</em>"
    en: "Non-coin objects recovered from the pit at the Ħal Tarxien Prehistoric Complex. The photograph was taken immediately after the material was removed from the pit."

