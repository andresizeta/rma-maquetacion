    es: Actividad en el frontis del ex cuartel Borgoño, conmemoración del golpe de Estado de 1973 (10 de septiembre de 2022, fotografía de la autora).
    en: <em>Activity at the front of the ex-Cuartel Borgoño, commemorating the 1973 coup d&#x27;état (September 10, 2022, photograph by the author).</em>
    archivo: Figura+2.jpg
