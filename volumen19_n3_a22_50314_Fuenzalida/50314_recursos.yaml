    es: Vista aérea con dron de la actividad “Mil Manos para Borgoño”, cuyo objetivo fue rodear el ex Cuartel Borgoño para exigir su restitución a la ciudadanía (8 de diciembre de 2018, Archivo de la Corporación Memoria Borgoño).
    en: <em>Aerial drone view of the activity “A Thousand Hands for Borgoño,” which aimed to surround the ex-Cuartel Borgoño to demand its restitution to the citizens (December 8, 2018, Borgoño Memory Corporation Archive).</em>
