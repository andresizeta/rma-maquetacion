    ancho: columna
    es: Celebración del Ministerio de Bienes Nacionales y Policía de Investigaciones de la firma de protocolo de restitución del ex cuartel Borgoño (10 de diciembre de 2024, fotografía de la autora)
    en: <em>Celebration by the Ministry of National Assets and the Investigations Police of the signing of the protocol for the restitution of the ex-Cuartel Borgoño  (December 10, 2024, photograph by the author)</em>
