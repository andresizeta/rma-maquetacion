figuras:
  1:
    ancho: "completo"
    es: "Ubicación geográfica de la sierra de Guasayán, provincia de Santiago del Estero."
    en: "<em>Geographic location of the Guasayán mountain range, Santiago del Estero province.</em>"
  2:
    ancho: "columna"
    es: "Sitios arqueológicos y unidades de excavación<strong>.</strong>"
    en: "<em>Archaeological sites and excavation units.</em> <em>A - Maquijata site, aerial view of the mound and excavated area; B - grid established at the Maquijata site; C - Conzo Tinajas site, aerial view of the excavated area; D - grid established at Conzo Tinajas; E - Sketch of the La Aguadita site; F - Excavation at the La Aguadita site (2019).</em>"
  3:
    ancho: "columna"
    es: "Restos arqueobotánicos."
    en: "<em> Archaeobotanical remains. </em> <em>A- Neltuma spp. seeds recovered from the Conzo Tinajas site (LF: fissural line); B and C- distal pod fragments of Neltuma spp. recovered from Test Pit 1 at the Maquijata site, showing the epicarp, mesocarp, and endocarp; D- complete endocarp of Sarcomphalus mistol from the Conzo Tinajas site; E- fragment of S. mistol endocarp from the Maquijata site; F- Prunus persica endocarp recovered from the La Aguadita site.</em>"

