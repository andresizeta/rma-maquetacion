name: Probar pipeline en Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Python en Windows
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pango y GTK3 64-bit oficial (MSYS2)
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-x86_64-pango"
          $gtkBin = "C:\msys64\mingw64\bin"
          if (-not (Test-Path "$gtkBin\libpango-1.0-0.dll")) {
            Write-Error "No se encontro libpango-1.0-0.dll en $gtkBin"
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "WEASYPRINT_DLL_DIRECTORIES=$gtkBin"
          Add-Content -Path $env:GITHUB_ENV -Value "PYTHONIOENCODING=utf-8"

      - name: Ejecutar instalar_windows.bat
        shell: cmd
        run: |
          call instalar_windows.bat < nul || (
            echo --- Diagnostico real de WeasyPrint ---
            .venv\Scripts\python.exe -c "import weasyprint; print(weasyprint.__version__)"
            exit /b 1
          )

      - name: Probar maquetacion de volumen19_n3_54854 y portada
        shell: cmd
        run: |
          .venv\Scripts\python.exe maquetar_rma.py volumen19_n3_54854 54854
          if exist tapa.bat (
            call tapa.bat < nul
          ) else (
            .venv\Scripts\python.exe generar_trama.py --vol 19 --num 3 --year 2026 --out trama.svg
            .venv\Scripts\python.exe -m weasyprint tapa.html tapa_v19n3.pdf --presentational-hints
          )

      - name: Empaquetar resultados para descargar
        uses: actions/upload-artifact@v4
        with:
          name: salidas-windows-rma
          if-no-files-found: ignore
          path: |
            tapa_*.pdf
            tapa_*.png
            salida/**/*
            volumen19_n3_54854/**/*
