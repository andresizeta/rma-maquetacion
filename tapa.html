<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Revista del Museo de Antropología · Vol. 20, N.º 1 (2027)</title>
  <link rel="stylesheet" href="tapa.css">
</head>
<body>
  <main class="cover-sheet">
    <!-- 1. Campo Superior Borravino con Tramado Orgánico -->
    <section class="upper-field">
      <img src="trama.svg" alt="" class="relief-bg" aria-hidden="true">
      <div class="upper-vignette" aria-hidden="true"></div>

      <header class="cover-header">
        <div class="masthead">
          <div class="issn-block">
            ISSN 1852-4826 <span>(versión electrónica)</span><br>
            ISSN 1852-060X <span>(versión impresa)</span>
          </div>
          <h1 class="revista-1960">REVISTA</h1>
          <p class="revista-sub">del Museo de Antropología</p>
        </div>

        <aside class="anniv-lockup" aria-label="Edición conmemorativa 20 años">
          <span class="anniv-num">20</span>
          <div class="anniv-text">
            <span class="anniv-word">AÑOS</span>
          </div>
        </aside>
      </header>
    </section>

    <!-- 2. Franja de Horizonte con los 5 Colores Disciplinares -->
    <div class="horizon-bar" aria-hidden="true">
      <span class="hbar-seg seg-arql"></span>
      <span class="hbar-seg seg-biol"></span>
      <span class="hbar-seg seg-soc"></span>
      <span class="hbar-seg seg-mus"></span>
      <span class="hbar-seg seg-dos"></span>
    </div>

    <!-- 3. Emblema Histórico RMA cabalgando la franja de colores -->
    <img src="assets/white/logo_rma.png" alt="Emblema de la Revista del Museo de Antropología" class="horizon-turtle">

    <!-- 4. Zócalo Institucional Borravino Limpio -->
    <footer class="cover-footer">
      <div class="issue-metadata">
        <p class="issue-citation">Volumen 20 - Número 1 - 2027 - Córdoba - Argentina</p>
        <ul class="affiliations-list">
          <li>UNIVERSIDAD NACIONAL DE CÓRDOBA</li>
          <li>FACULTAD DE FILOSOFÍA Y HUMANIDADES</li>
          <li>MUSEO DE ANTROPOLOGÍA</li>
          <li>IDACOR - CONICET/UNC</li>
        </ul>
      </div>

      <div class="institutional-logos" aria-label="Avales institucionales">
        <img src="assets/white/unc3_h.png" alt="Universidad Nacional de Córdoba" class="inst-logo inst-logo-unc">
        <img src="assets/white/ffyh.png" alt="Facultad de Filosofía y Humanidades - UNC" class="inst-logo inst-logo-ffyh">
        <img src="assets/white/logo-museo-2026.png" alt="Museo de Antropología - FFyH - UNC" class="inst-logo inst-logo-museo">
        <img src="assets/white/Logo-IDACOR.png" alt="Instituto de Antropología de Córdoba (IDACOR - CONICET / UNC)" class="inst-logo inst-logo-idacor">
      </div>
    </footer>
  </main>
</body>
</html>
